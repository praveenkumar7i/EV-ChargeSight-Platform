<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 470" width="1060" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c36"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1060" height="470" rx="18" fill="url(#bg)"/>
  <text x="530" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="url(#title)">From Fault to Fix  ·  Ticket &amp; Priority Workflow</text>

  <!-- Stage 1: pipeline -->
  <text x="40" y="66" font-size="12" font-weight="700" letter-spacing="2" fill="#94a3b8">1 · INTELLIGENT PIPELINE</text>

  <g font-size="12">
    <rect x="40" y="80" width="170" height="92" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="125" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#a78bfa">Fault source</text>
    <text x="125" y="128" text-anchor="middle" fill="#e2e8f0">Simulator · OCPP</text>
    <text x="125" y="146" text-anchor="middle" fill="#e2e8f0">Operator API · CSV</text>
    <text x="125" y="164" text-anchor="middle" fill="#e2e8f0">User report</text>

    <rect x="242" y="80" width="170" height="92" rx="12" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="327" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#22d3ee">Ticket</text>
    <text x="327" y="128" text-anchor="middle" fill="#e2e8f0">One pipeline</text>
    <text x="327" y="146" text-anchor="middle" fill="#e2e8f0">Deduplicated</text>
    <text x="327" y="164" text-anchor="middle" fill="#e2e8f0">Severity assigned</text>

    <rect x="445" y="80" width="170" height="92" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="530" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#fbbf24">Priority engine</text>
    <text x="530" y="128" text-anchor="middle" fill="#e2e8f0">Explainable score</text>
    <text x="530" y="146" text-anchor="middle" fill="#e2e8f0">Ranked queue</text>
    <text x="530" y="164" text-anchor="middle" fill="#e2e8f0">Ageing &amp; escalation</text>

    <rect x="647" y="80" width="170" height="92" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <text x="732" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#34d399">Assignment</text>
    <text x="732" y="128" text-anchor="middle" fill="#e2e8f0">Skills · AC/DC</text>
    <text x="732" y="146" text-anchor="middle" fill="#e2e8f0">Safety certification</text>
    <text x="732" y="164" text-anchor="middle" fill="#e2e8f0">Capacity · shifts</text>

    <rect x="850" y="80" width="170" height="92" rx="12" fill="#1e293b" stroke="#f472b6" stroke-width="1.5"/>
    <text x="935" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#f472b6">SLA &amp; audit</text>
    <text x="935" y="128" text-anchor="middle" fill="#e2e8f0">Deadline tracking</text>
    <text x="935" y="146" text-anchor="middle" fill="#e2e8f0">Single escalation</text>
    <text x="935" y="164" text-anchor="middle" fill="#e2e8f0">Full audit trail</text>
  </g>
  <g stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr)">
    <path d="M210,126 L240,126"/><path d="M412,126 L443,126"/><path d="M615,126 L645,126"/><path d="M817,126 L848,126"/>
  </g>

  <!-- Stage 2: lifecycle -->
  <text x="40" y="214" font-size="12" font-weight="700" letter-spacing="2" fill="#94a3b8">2 · TICKET LIFECYCLE</text>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="40" y="228" width="130" height="44" rx="22" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1.5"/><text x="105" y="256" fill="#fca5a5">Open</text>
    <rect x="210" y="228" width="130" height="44" rx="22" fill="#fbbf24" fill-opacity="0.2" stroke="#fbbf24" stroke-width="1.5"/><text x="275" y="256" fill="#fcd34d">Assigned</text>
    <rect x="380" y="228" width="130" height="44" rx="22" fill="#22d3ee" fill-opacity="0.2" stroke="#22d3ee" stroke-width="1.5"/><text x="445" y="256" fill="#67e8f9">En Route</text>
    <rect x="550" y="228" width="130" height="44" rx="22" fill="#a78bfa" fill-opacity="0.2" stroke="#a78bfa" stroke-width="1.5"/><text x="615" y="256" fill="#c4b5fd">On Site</text>
    <rect x="720" y="228" width="130" height="44" rx="22" fill="#34d399" fill-opacity="0.2" stroke="#34d399" stroke-width="1.5"/><text x="785" y="256" fill="#6ee7b7">Resolved</text>
    <rect x="890" y="228" width="130" height="44" rx="22" fill="#34d399" stroke="#34d399" stroke-width="1.5"/><text x="955" y="256" fill="#0b1220">Closed ✓</text>
  </g>
  <g stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr)">
    <path d="M170,250 L208,250"/><path d="M340,250 L378,250"/><path d="M510,250 L548,250"/><path d="M680,250 L718,250"/><path d="M850,250 L888,250"/>
  </g>

  <!-- side branches -->
  <g font-size="11" text-anchor="middle">
    <rect x="530" y="300" width="170" height="40" rx="10" fill="none" stroke="#a78bfa" stroke-dasharray="5 4"/>
    <text x="615" y="317" fill="#c4b5fd" font-weight="700">Waiting</text>
    <text x="615" y="332" fill="#94a3b8">for parts / access</text>
    <path d="M615,272 L615,298" stroke="#a78bfa" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)"/>

    <rect x="25" y="300" width="160" height="40" rx="10" fill="none" stroke="#ef4444" stroke-dasharray="5 4"/>
    <text x="105" y="317" fill="#fca5a5" font-weight="700">SLA breach</text>
    <text x="105" y="332" fill="#94a3b8">escalated once</text>
    <path d="M105,272 L105,298" stroke="#ef4444" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)"/>

    <rect x="860" y="300" width="190" height="40" rx="10" fill="none" stroke="#34d399" stroke-dasharray="5 4"/>
    <text x="955" y="317" fill="#6ee7b7" font-weight="700">Verified close</text>
    <text x="955" y="332" fill="#94a3b8">safety inspection first</text>
    <path d="M955,272 L955,298" stroke="#34d399" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- Stage 3: priority formula -->
  <text x="40" y="378" font-size="12" font-weight="700" letter-spacing="2" fill="#94a3b8">3 · PRIORITY SCORE</text>
  <rect x="40" y="390" width="980" height="62" rx="14" fill="#16263f" stroke="#334155"/>
  <text x="70" y="428" font-size="22" font-weight="700" fill="#fbbf24" font-family="Consolas, Menlo, monospace">P = 0.4S + 0.3U + 0.2R + 0.1A</text>

  <!-- weight bars -->
  <g font-size="11" font-weight="700">
    <text x="470" y="414" fill="#94a3b8" font-weight="400">term weights</text>
    <rect x="470" y="420" width="160" height="14" rx="7" fill="#ef4444"/><text x="478" y="431" fill="#0b1220">S 0.4</text>
    <rect x="636" y="420" width="120" height="14" rx="7" fill="#fbbf24"/><text x="644" y="431" fill="#0b1220">U 0.3</text>
    <rect x="762" y="420" width="80" height="14" rx="7" fill="#22d3ee"/><text x="770" y="431" fill="#0b1220">R 0.2</text>
    <rect x="848" y="420" width="40" height="14" rx="7" fill="#a78bfa"/><text x="853" y="431" fill="#0b1220" font-size="9">A 0.1</text>
    <text x="470" y="447" fill="#94a3b8" font-weight="400">every ticket shows each term's contribution to the total</text>
  </g>
</svg>
