    <circle cx="58" cy="108" r="14" fill="#a78bfa"/><text x="58" y="113" text-anchor="middle" font-weight="700" fill="#0b1220">S</text>
    <text x="82" y="104" font-weight="700" fill="#e2e8f0">Seeded Simulator</text>
    <text x="82" y="122" font-size="11" fill="#94a3b8">SIMULATED fleet events</text>

