    <text x="82" y="282" font-size="11" fill="#94a3b8">Retries · validation</text>

    <rect x="30" y="316" width="210" height="64" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <circle cx="58" cy="348" r="14" fill="#fbbf24"/><text x="58" y="353" text-anchor="middle" font-weight="700" fill="#0b1220">C</text>
