    <text x="82" y="362" font-size="11" fill="#94a3b8">Authorised operator exports</text>

    <rect x="30" y="396" width="210" height="64" rx="12" fill="#1e293b" stroke="#f472b6" stroke-width="1.5"/>
    <circle cx="58" cy="428" r="14" fill="#f472b6"/><text x="58" y="433" text-anchor="middle" font-weight="700" fill="#0b1220">M</text>
