    <rect x="235" y="524" width="96" height="22" rx="11" fill="#a78bfa" fill-opacity="0.15" stroke="#a78bfa"/><text x="283" y="539" text-anchor="middle" fill="#a78bfa">SIMULATED</text>
    <rect x="341" y="524" width="62" height="22" rx="11" fill="#34d399" fill-opacity="0.15" stroke="#34d399"/><text x="372" y="539" text-anchor="middle" fill="#34d399">LIVE</text>
    <rect x="413" y="524" width="88" height="22" rx="11" fill="#fbbf24" fill-opacity="0.15" stroke="#fbbf24"/><text x="457" y="539" text-anchor="middle" fill="#fbbf24">IMPORTED</text>
