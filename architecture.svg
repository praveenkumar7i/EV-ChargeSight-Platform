  <text x="930" y="180" text-anchor="middle" font-size="11" fill="#e2e8f0">Console · Analytics · Map</text>
  <text x="930" y="198" text-anchor="middle" font-size="11" fill="#e2e8f0">Tickets · Feasibility</text>
  <text x="930" y="216" text-anchor="middle" font-size="11" fill="#e2e8f0">Reports · Validation</text>

  <path d="M770,160 L830,160" stroke="#94a3b8" stroke-width="1.8" marker-start="url(#arr)" marker-end="url(#arr)"/>
